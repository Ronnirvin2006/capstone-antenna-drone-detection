<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RF Waterfall Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1 id="frequencyText">2.400.000.000</h1>
          <p id="sourceText">2.4 GHz centered RF waveform and waterfall</p>
        </div>
        <section class="alert-panel quiet">
          <span class="alert-label">Receiver</span>
          <strong id="receiverText">Offline</strong>
          <span id="gainText">Start live mode to scan HackRF</span>
          <span id="statsText">0 sweep lines</span>
        </section>
      </header>

      <section class="toolbar" aria-label="Receiver toolbar">
        <button class="tool-button active" type="button">Start</button>
        <button class="tool-button" type="button">Peak</button>
        <button class="tool-button" type="button">Rec</button>
        <button class="tool-button" type="button">RFID</button>
        <button class="tool-button" type="button">Video</button>
      </section>

      <section class="receiver-layout">
        <section id="waterfalls" class="waterfall-grid" aria-label="Waterfall graphs"></section>
        <aside class="side-panel">
          <h2>Receiver Options</h2>
          <div class="readout" id="offsetText">0.000 kHz</div>
          <label>Hardware freq <span id="hardwareFreqText">2400.000000 MHz</span></label>
          <label>Frequency <span id="inputFreqText">2400000.000 kHz</span></label>
          <label>Filter width <span>IQ span</span></label>
          <label>Filter shape <span>Normal</span></label>
          <label>Mode <span>Raw I/Q</span></label>
          <label>AGC <span>Off</span></label>
          <label>Squelch <span>-150.0 dB</span></label>
          <div class="tabs">
            <button>Input</button>
            <button>Receiver</button>
            <button>FFT</button>
          </div>
          <h2>Peak Readout</h2>
          <div id="peakLog" class="event-log compact"></div>
          <h2>Process Log</h2>
          <div id="processLog" class="process-log"></div>
        </aside>
      </section>
    </main>

    <template id="waterfallTemplate">
      <article class="waterfall-card">
        <canvas class="spectrum-canvas" width="640" height="160"></canvas>
        <canvas class="waterfall-canvas" width="640" height="360"></canvas>
        <div class="scale-row">
          <span data-field="low"></span>
          <span data-field="range"></span>
          <span data-field="high"></span>
        </div>
        <div class="meta-row">
          <span data-field="noise"></span>
          <span data-field="peak"></span>
        </div>
        <div class="marker-row" data-field="markers"></div>
      </article>
    </template>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
  </body>
</html>
