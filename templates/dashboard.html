<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RF Waterfall Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>RF Waterfall Monitor</h1>
          <p id="sourceText">2.4 GHz centered RF waveform and waterfall</p>
        </div>
        <section class="alert-panel quiet">
          <span class="alert-label">Receiver</span>
          <strong id="receiverText">Offline</strong>
          <span id="gainText">Start live mode to scan HackRF</span>
          <span id="statsText">0 sweep lines</span>
        </section>
      </header>

      <section class="actions" aria-label="Detection controls">
        <button class="action-button active" type="button">Waterfall</button>
        <button class="action-button" type="button">Peak Hold</button>
        <button class="action-button" type="button">Filters</button>
        <button class="action-button" type="button">RFID Detection</button>
        <button class="action-button" type="button">Video Detection</button>
      </section>

      <section id="waterfalls" class="waterfall-grid" aria-label="Waterfall graphs"></section>

      <section class="event-strip">
        <h2>Peak Readout</h2>
        <div id="peakLog" class="event-log"></div>
      </section>

      <section class="event-strip">
        <h2>Process Log</h2>
        <div id="processLog" class="process-log"></div>
      </section>
    </main>

    <template id="waterfallTemplate">
      <article class="waterfall-card">
        <div class="card-head">
          <div>
            <h2 data-field="label"></h2>
            <p data-field="antenna"></p>
          </div>
          <span class="pill" data-field="status"></span>
        </div>
        <canvas class="spectrum-canvas" width="640" height="160"></canvas>
        <canvas class="waterfall-canvas" width="640" height="360"></canvas>
        <div class="scale-row">
          <span data-field="low"></span>
          <span data-field="range"></span>
          <span data-field="high"></span>
        </div>
        <div class="meta-row">
          <span data-field="noise"></span>
          <span data-field="peak"></span>
        </div>
        <div class="marker-row" data-field="markers"></div>
      </article>
    </template>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
  </body>
</html>
